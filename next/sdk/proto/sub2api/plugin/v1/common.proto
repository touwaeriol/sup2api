syntax = "proto3";

package sub2api.plugin.v1;

option go_package = "github.com/Sub2API-Devs/sup2api/next/sdk/gen/pluginv1;pluginv1";

// Contract rules (keep the contract usable by a future JS runtime):
//  - every RPC except EgressService.Dial is unary;
//  - no google.protobuf.Any;
//  - free-form JSON travels as a string field whose name ends in `_json`;
//  - a platform plugin receives the request body whole, already rewritten
//    by the host, in PlatformService.Execute, and hands back the final
//    upstream request through HostService.RelayUpstream; gateway hooks still
//    see only the fields they declare and answer with BodyPatch instructions.

// BodyPatch is a single JSON edit the host applies to a request body (sjson).
message BodyPatch {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_SET = 1;
    OP_DELETE = 2;
  }
  Op op = 1;
  // gjson/sjson path, e.g. "model" or "metadata.user_id".
  string path = 2;
  // JSON-encoded value for OP_SET, e.g. "\"claude-x\"" or "1024".
  string value_json = 3;
}

// Account is what a platform plugin sees of one core account row.
message Account {
  int64 id = 1;
  string name = 2;
  string platform = 3;         // platform of the client endpoint serving this request
  string type = 4;             // account type id, declared by the called plugin
  // Decrypted credentials. A plugin receives the accounts of the account
  // types it declares, and only those (CONTRACTS §124).
  string credentials_json = 5;
  // Non-sensitive settings (base_url, model_mapping ...).
  string settings_json = 6;
  AccountProperties properties = 7;
  // The proxy this call's requests go out through, password included; unset
  // when the account has none (direct). Data only: every request of the
  // account is sent by the host, which enforces this proxy; a plugin never
  // connects through it itself (CONTRACTS §124).
  AccountProxy proxy = 8;
}

// AccountProxy is the proxy of an Account (CONTRACTS §124). Never log it:
// the password is in clear.
message AccountProxy {
  int64 id = 1;
  string protocol = 2;   // http | https | socks5
  string host = 3;
  int32 port = 4;
  string username = 5;
  string password = 6;
}

message AccountProperties {
  string status = 1;
  bool schedulable = 2;
  bool auto_disable = 3;
  int32 priority = 4;
  int32 weight = 5;
  int32 max_concurrency = 6;
  int32 rpm_limit = 7;
  int64 tpm_limit = 8;
  reserved 9;
  reserved "proxy_id";
  repeated string models = 10;
  map<string, string> model_mapping = 11;
  reserved 12;
  reserved "auto_models";
  // Limits of lists of client models on top of the account's own
  // (CONTRACTS §68); a model is in at most one list.
  repeated ModelLimit model_limits = 13;
  // Sessions per minute: sticky sessions active in the last 60 seconds
  // (CONTRACTS §71); 0 = unlimited.
  int32 spm_limit = 14;
}

// ModelLimit caps the requests of a list of models on one account; the models
// of the list share one set of counters. 0 = unlimited.
message ModelLimit {
  repeated string models = 1;
  int32 max_concurrency = 2;
  int32 rpm_limit = 3;
  int64 tpm_limit = 4;
  // Sessions per minute of the list (CONTRACTS §71).
  int32 spm_limit = 5;
}

// Caller identifies the console user on whose behalf the host calls a plugin.
message Caller {
  int64 user_id = 1;
  string request_id = 2;
  string client_ip = 3;
  string locale = 4;
}

// RequestMeta describes one gateway request.
message RequestMeta {
  string request_id = 1;
  // Protocol the upstream request must speak, e.g. "anthropic.messages".
  // Differs from client_protocol when the core converts the request.
  string protocol = 2;
  string model = 3;
  bool stream = 4;
  int64 user_id = 5;
  int64 api_key_id = 6;
  int64 group_id = 7;
  string client_ip = 8;
  // Protocol of the client-facing endpoint (ARCHITECTURE 6.6).
  string client_protocol = 9;
  // Path parameters of the matched endpoint pattern, e.g. "model" for
  // /v1beta/models/:model:generateContent. Empty when the pattern has none.
  // Every entry as the client sent it, of any size; invalid UTF-8 dropped.
  map<string, string> path_params = 10;
  // Query parameters the endpoint declared in request.queryParams, and only
  // those: the plugin states what it needs and the host hands over nothing
  // else. The endpoint's
  // auth.query parameter is always excluded (case-insensitively) because it
  // carries the API key, and the host never ships the whole query string:
  // that would leak credentials in parameters nobody declared.
  //
  // Names are matched case-insensitively, so a declared "alt" also picks up
  // "?Alt=sse"; the key is the name as the client sent it. Only the first
  // value of a repeated parameter is passed. Empty when the endpoint declared
  // none. Every declared entry of any size, invalid UTF-8 dropped.
  map<string, string> query = 11;
  // Resolved environment variables (CONTRACTS §74.3): the nearest of
  // account, group, global and process layers for every key some layer
  // sets; a missing key means the plugin's own default. Set on every call
  // that carries RequestMeta. Calls of an attempt on an account (execute,
  // classify) include the account layer; calls
  // made before an account is chosen (gateway.request hooks, model
  // resolution, usage estimation, scheduler.rank) resolve without it.
  map<string, int64> environment = 12;
  // Path pattern of the matched client-facing endpoint, e.g. "/v1/messages"
  // or "/v1beta/models/:model:generateContent" - the endpoint the usage log
  // records. Set on every request.
  string endpoint = 13;
  // Opaque id of the request's sticky session (CONTRACTS §25.1): hex
  // HMAC-SHA-256 of the sticky key the first matching rule derives, keyed
  // with a key derived from the core's master key, so requests of one
  // session share it while the raw session value never leaves the core and
  // the id cannot be recomputed (or matched against a guessed session
  // value) without the master key. Derived once, before the gateway.request
  // hooks run. Empty when no rule yields a session value.
  string session_fingerprint = 14;
  // Account of the attempt (CONTRACTS §85): set on gateway.attempt hook
  // calls and on every call of an attempt on an account (execute,
  // classify); 0 on calls made before an account is
  // chosen (gateway.request hooks, model resolution, usage estimation,
  // scheduler.rank).
  int64 account_id = 15;
}

// FieldError reports a validation problem on one input field.
message FieldError {
  string field = 1;          // JSON path within the submitted object
  string code = 2;           // machine readable, e.g. "required", "pattern"
  string message = 3;        // human readable, localized by the plugin if possible
}

// UsageTokens are the token counts of one upstream response, in exactly the
// shape the declarative usage rules produce (manifest usage.json / usage.sse
// keys). The host normalises and prices them; a plugin states what the
// upstream reported and never what it costs.
//
// cache_creation_tokens is the TOTAL cache write, including the 1 hour part:
// the host subtracts cache_creation_1h_tokens from it, exactly as it does for
// the declarative rules, so both sources mean the same thing. A negative
// value counts as 0.
message UsageTokens {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_tokens = 3;
  int64 cache_creation_tokens = 4;
  int64 cache_creation_1h_tokens = 5;
}

// ActionScope is a console user's scope of one scoped plugin permission
// (CONTRACTS §21.0, plugin resources): what the core decided, for the plugin
// to filter by. Unset fields mean nothing is reached.
message ActionScope {
  // Fully qualified action key without a scope: "plugin.moderation:flow:manage".
  string permission = 1;
  // Every row of the resource.
  bool all = 2;
  // The rows the user created. Only the plugin knows its rows' creator: it
  // MUST check its own created_by (Caller.user_id) for any value not in values.
  bool own = 3;
  // The <value> of the user's "<resource>/<value>" grants, sorted, once each.
  repeated string values = 4;
}
