syntax = "proto3";

package sub2api.plugin.v1;

import "sub2api/plugin/v1/common.proto";

option go_package = "github.com/Sub2API-Devs/sup2api/next/sdk/gen/pluginv1;pluginv1";

// PlatformService is implemented by plugins declaring capability
// "platform.adapter.v1". Static facts (platform id, protocols, account types,
// forms, usage extraction rules, default pricing) live in manifest.json; this
// service only covers behaviour that needs code.
service PlatformService {
  // Pre-upstream metering estimate. The host checks endpoint billing types
  // first and prices the report itself; plugins never specify an amount.
  rpc EstimateUsage(EstimateUsageRequest) returns (UsageReport);
  // The one path of a gateway request, called once per attempt on an
  // account. The host selected the account and has already rewritten the
  // body (protocol conversion, model mapping, forced streaming, the
  // operator's parameter overrides); the plugin receives that body WHOLE,
  // builds the final upstream request - signing it itself when the upstream
  // needs that - and hands it to the host's HTTP client with
  // HostService.RelayUpstream. It may first make auxiliary requests with
  // HostService.ExecuteHTTP. It opens no socket, never retries and never
  // picks another account.
  //
  // Usage and task facts travel only in the response. Which form the
  // exchange takes follows the two flags of the request:
  //   - neither flag: relay without waiting and return host_usage. The
  //     request is sent only after this call returned, so the plugin is not
  //     part of the exchange: an error, a timeout or a crash before the
  //     return leaves nothing sent and the host moves to another account.
  //   - extract_usage or task_submission: relay and wait, read the
  //     observation and return usage or task (host_usage when the usage
  //     cannot be read; classification for an upstream error).
  // The host does not time the plugin's own work in this call: it ends with
  // the client leaving, the upstream's timeouts on a relay, or the plugin's
  // process.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  // One scheduled observation of a host-managed asynchronous task. The
  // plugin queries the upstream once through HostService.ExecuteHTTP and
  // returns what it read; the host reschedules or settles in one
  // transaction. Scheduling, fencing, snapshots and financial transactions
  // remain host-owned: the plugin needs no timer and no net grant.
  // Requires platform.monitor.v1.
  rpc Monitor(PollRequest) returns (MonitorResponse);
  rpc ValidateCredentials(ValidateCredentialsRequest) returns (ValidateCredentialsResponse);
  // Called once per failed upstream attempt. A relay that waited is the
  // exception: the plugin classifies that error in ExecuteResponse.
  rpc ClassifyError(ClassifyErrorRequest) returns (ClassifyErrorResponse);
  // Builds a minimal request used by the console "test account" button.
  rpc BuildTestRequest(BuildTestRequestRequest) returns (BuildTestRequestResponse);
  // Builds the request listing the models the account can reach; the host
  // sends it and extracts the ids (console "fetch models" button, CONTRACTS
  // §19). Optional: answer UNIMPLEMENTED when the upstream has no such API.
  rpc BuildModelsRequest(BuildModelsRequestRequest) returns (BuildModelsRequestResponse);
  // Resolves the model of one gateway request for endpoints whose model is
  // not in the request at all (manifest request.modelSource: "plugin").
  //
  // Implemented by the plugin declaring the endpoint's PLATFORM, not the one
  // owning the account type: it runs before scheduling, when no account has
  // been picked yet. The host calls it only for endpoints declaring
  // modelSource "plugin", on the hot path, before hook matching, the group
  // allowlist, pricing and the candidate `models` filter - the model decides
  // all four, so there is no later point to ask.
  //
  // Optional: answer UNIMPLEMENTED when no endpoint needs it. A plugin whose
  // endpoint declares modelSource "plugin" must also declare capability
  // "platform.adapter.v1" (install-time check): without it the host has no
  // PlatformService to call at all.
  //
  // Failure is never permissive: an UNIMPLEMENTED, an error, a timeout or an
  // empty model all end the request with 400 "model is required". Without a
  // model the host cannot price or limit the request, so serving it would
  // serve it for free.
  rpc ResolveModel(ResolveModelRequest) returns (ResolveModelResponse);
  // Builds the request that reads the subscription quota of one account
  // (5-hour / weekly windows and the like, CONTRACTS §44), for account types
  // declaring manifest accountTypes[].quota.query. Same division of labour
  // as BuildTestRequest and BuildModelsRequest: the plugin DESCRIBES the
  // request, the host sends it through the account's proxy, behind its SSRF
  // guard and timeout, and hands the answer to ParseQuotaResponse. The host
  // decides when to ask - at most once per account every 30 seconds, and
  // normally only when its snapshot is older than 3 minutes - so the plugin
  // needs no "net" permission and no cache of its own.
  //
  // Called on the plugin declaring the account type; the account carries its
  // credentials as in BuildTestRequest. Optional: answer UNIMPLEMENTED and
  // the host keeps the snapshot it samples passively from the gateway's
  // upstream responses (manifest accountTypes[].quota.headers).
  rpc BuildQuotaRequest(BuildQuotaRequestRequest) returns (BuildQuotaRequestResponse);
  // Reads the upstream's answer to the request above into quota windows. It
  // states upstream facts only; the host stores, merges and serves them.
  rpc ParseQuotaResponse(ParseQuotaResponseRequest) returns (QuotaResult);
  rpc CheckModelAvailability(CheckModelAvailabilityRequest) returns (CheckModelAvailabilityResponse);
  // Builds the request that renews the credentials of one account (an OAuth
  // access token from its refresh token, CONTRACTS §48), for account types
  // declaring manifest accountTypes[].refresh. Same division of labour as
  // BuildQuotaRequest: the plugin DESCRIBES the request, the host sends it
  // through the account's proxy, behind its SSRF guard and timeout, and
  // hands the answer to ParseRefreshResponse. The host decides when: before
  // the credentials expire (refresh.beforeExpirySec), under a cluster-wide
  // lock per account so a rotating refresh token is used exactly once, and
  // when an administrator asks. The plugin needs no "net" permission, no
  // job and no write access to accounts.
  //
  // Called on the plugin declaring the account type, with the credentials
  // as stored. Optional: answer UNIMPLEMENTED and nothing is refreshed.
  // Answer FAILED_PRECONDITION when these credentials cannot be renewed at
  // all (no refresh token): the host records it like ERROR_TYPE_AUTH_REJECTED
  // and does not ask again until the credentials change.
  rpc BuildRefreshRequest(BuildRefreshRequestRequest) returns (BuildRefreshRequestResponse);
  // Reads the upstream's answer to the request above. On success it returns
  // the credential fields that changed; the host merges them into the stored
  // credentials (other fields are kept), encrypts and saves them, and only if
  // nobody changed the account in the meantime.
  rpc ParseRefreshResponse(ParseRefreshResponseRequest) returns (RefreshResult);
  // Builds the requests that read the balance of one account (CONTRACTS
  // §52), for account types declaring manifest accountTypes[].balance. Same
  // division of labour as BuildQuotaRequest: the plugin DESCRIBES the
  // requests, the host sends them and hands all the answers to
  // ParseBalanceResponse. A balance may take several requests (the key's
  // quota, then the site's unit of account); the host checks every URL
  // against the manifest's upstream host rules before it sends any, then
  // sends them one after the other, in order, through the account's proxy,
  // behind its SSRF guard and without following redirects. The host decides
  // when: when an administrator asks (GET /accounts/:id/balance) and every
  // manifest balance.updateInterval seconds, so the plugin needs no "net"
  // permission and no cache of its own.
  //
  // Called on the plugin declaring the account type; the account carries its
  // credentials as in BuildTestRequest. Optional: answer UNIMPLEMENTED and
  // the host treats the account type as having no balance.
  rpc BuildBalanceRequest(BuildBalanceRequestRequest) returns (BuildBalanceRequestResponse);
  // Reads the upstream's answers to the requests above into a balance. It
  // states upstream facts only; the host stores and shows them, and never
  // acts on them (no disabling, no scheduling change, no alert).
  rpc ParseBalanceResponse(ParseBalanceResponseRequest) returns (ParseBalanceResponseResponse);
}

message EstimateUsageRequest {
  RequestMeta meta = 1;
  map<string, string> fields = 2;
  reserved 3;
  reserved "fields_omitted";
  int64 pre_consume_tokens = 4;
  string prompt = 5;
}

message ExecuteRequest {
  reserved 1;
  reserved "request";
  // Opaque, invocation-local authority for HostService.RelayUpstream and
  // ExecuteHTTP. The SDK binds it to the call's context. Never persist it or
  // use it outside the current Execute invocation.
  string execution_token = 2;
  RequestMeta meta = 3;
  // The account of this attempt, credentials included.
  Account account = 4;
  // The whole request body in the upstream protocol (meta.protocol), after
  // every rewrite the host owns; on a websocket endpoint the message of
  // this turn. The client's request passed the gateway's request body
  // limit; the host's own rewrites may make this larger, and its size is
  // not checked again.
  bytes body = 5;
  // Client headers from the host allow-list (lower-cased names).
  map<string, string> inbound_headers = 6;
  // 0 for the first attempt, incremented on failover. Every attempt is
  // built from scratch.
  int32 attempt = 7;
  // The endpoint's usage is read by this plugin (manifest usageSource
  // "plugin"): relay and wait, return usage.
  bool extract_usage = 8;
  // The endpoint submits a host-managed task (endpoint.task.action=submit):
  // relay and wait, return task.
  bool task_submission = 9;
}

message ExecuteResponse {
  // An upstream error the plugin saw (a waited relay, or a failed
  // ExecuteHTTP before the relay). The host still decides whether another
  // account may be attempted; absent, it applies its default classification.
  ClassifyErrorResponse classification = 1;
  // What the plugin states about the exchange; at most one. None of them
  // after a relay that waited: the execution is unreported and not billed.
  oneof report {
    // The usage the plugin read from the observation (extract_usage).
    UsageReport usage = 2;
    // Take the usage the host reads by the declared rules: the answer of
    // every relay that did not wait, and the explicit fallback of one that
    // waited when the plugin could not read the observation.
    HostUsage host_usage = 3;
    // The accepted upstream task (task_submission). The host registers it,
    // replaces the request's precharge with usage.reserve and only then
    // publishes the submission response.
    TaskSubmission task = 4;
  }
}

// HostUsage is the explicit "use the host's reading", so that it cannot be
// confused with a response that states nothing. On an endpoint whose usage
// the plugin reads (usage.source plugin), a reading of a served answer that
// holds no usage at all is no fact either: the request is unreported (a
// free usage_unreported record), never billed as zero.
message HostUsage {}

message MonitorResponse {
  // PENDING or a terminal state. Unset counts as one failed query. A
  // terminal state is accepted only with one complete, successful
  // ExecuteHTTP exchange made during this call.
  ReconcileResult result = 1;
}

message PollRequest {
  ReconcileEntry entry = 1;
  // The account that served the submission, credentials included.
  Account account = 2;
  // Opaque, invocation-local authority for HostService.ExecuteHTTP. The SDK
  // binds it to the call's context. Never persist it or use it outside the
  // current Monitor invocation.
  string execution_token = 3;
}

message ValidateCredentialsRequest {
  string account_type = 1;
  string credentials_json = 2;
  string settings_json = 3;
}

message ValidateCredentialsResponse {
  repeated FieldError errors = 1;  // empty = valid
  // Optional normalized values the host should store instead of the input.
  string normalized_credentials_json = 2;
  string normalized_settings_json = 3;
}

message ClassifyErrorRequest {
  RequestMeta meta = 1;
  Account account = 2;
  int32 status = 3;                // 0 = transport error (see transport_error)
  map<string, string> headers = 4; // lower-cased
  bytes body_prefix = 5;           // first 4 KiB of the upstream body
  string transport_error = 6;
}

message AccountAutomaticState {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_DISABLE = 1;
    ACTION_CLEAR = 2;
  }
  Action action = 1;
  string reason = 2;
  oneof release {
    int64 until_unix = 3;
    int64 duration_seconds = 4;
  }
}

message ClassifyErrorResponse {
  enum Action {
    ACTION_UNSPECIFIED = 0;        // treated as FAILOVER
    ACTION_RETURN_TO_CLIENT = 1;
    ACTION_FAILOVER = 2;
  }
  enum AccountEffect {
    ACCOUNT_EFFECT_UNSPECIFIED = 0; // none
    ACCOUNT_EFFECT_COOLDOWN = 1;
    ACCOUNT_EFFECT_DISABLE = 2;
  }
  Action action = 1;
  AccountEffect account_effect = 2;
  int64 cooldown_until_unix = 3;   // for COOLDOWN
  string reason = 4;               // shown on the account row
  int32 client_status = 5;         // status returned to the client, 0 = upstream status
  string client_error_type = 6;    // protocol error type, e.g. "rate_limit_error"
  string client_message = 7;
  // Machine-readable error code rendered in the client error body ("code" in
  // the anthropic/openai/plain formats, "reason" in the gemini one). It is the
  // only place the plugin's own classification of an upstream failure reaches
  // the client: without it every upstream error looks like "upstream_error",
  // so a content-moderation block and a bad parameter are indistinguishable to
  // an SDK. Leave it empty to keep "upstream_error" (the pre-existing
  // behaviour, which every plugin written before this field gets).
  //
  // The value ends up in a body the client reads, so the host constrains it:
  // at most 64 bytes matching ^[A-Za-z0-9][A-Za-z0-9._:-]*$ (upstream codes
  // such as "InputTextSensitiveContentDetected" or "context_length_exceeded"
  // fit). A value outside that is DROPPED, not truncated - a truncated code is
  // a different code, and silently inventing one is worse than falling back to
  // "upstream_error" - and the host logs a warning.
  string client_error_code = 8;
  AccountAutomaticState automatic_state = 9;
  bool local_failure = 10;
  QuotaResult quota = 12;
}

message BuildTestRequestRequest {
  Account account = 1;
  string model = 2;                // optional, plugin default when empty
  // The protocols this test may use, most preferred first: the account's own
  // platform protocols it serves (its protocol binding applied, in the order
  // of the account type's platforms and of their endpoints), without
  // WebSocket and token-counting protocols, and - when model is set - only
  // those serving that model. A plugin with one test per protocol picks the
  // first it has a test for; one with a single test may ignore the list.
  // Empty: the host has no preference. Report the protocol actually used in
  // BuildTestRequestResponse.usage_protocol; the host classifies a failed
  // test with it as meta.protocol.
  repeated string protocols = 3;
}

message BuildTestRequestResponse {
  string method = 1;
  string url = 2;
  map<string, string> headers = 3;
  string body_json = 4;
  // The model the plugin actually requested. Set it when the host passed an
  // empty model and the plugin fell back to its own default, so the console
  // can show what was really tested.
  string model = 5;
  // Protocol whose usage rules describe this test response, e.g.
  // "anthropic.messages". The host uses it to extract the token counts from
  // the response body. Empty = the host does not report usage.
  string usage_protocol = 6;
}

message BuildModelsRequestRequest {
  Account account = 1;
}

message BuildModelsRequestResponse {
  string method = 1;               // default "GET"
  string url = 2;
  map<string, string> headers = 3;
  string body_json = 4;            // optional
  // gjson path yielding the model ids in the response, e.g. "data.#.id" or
  // "models.#.name".
  string ids_path = 5;
  // Prefix removed from every id, e.g. "models/" for Gemini.
  string strip_prefix = 6;
}

message ResolveModelRequest {
  // meta.model is empty (that is what this call answers); meta.path_params
  // and meta.query carry the parts of the URL the endpoint declared.
  RequestMeta meta = 1;
  reserved 2;
  reserved "fields";
  // Client headers from the platform's passHeaders allow-list (lower-cased).
  map<string, string> inbound_headers = 3;
}

message ResolveModelResponse {
  // The model this request bills as. Empty ends the request with 400
  // "model is required".
  string model = 1;
  // Whether the response streams. It replaces request.streamPath, which such
  // an endpoint must not declare; an endpoint declaring request.stream (it
  // always streams) keeps that, the plugin cannot turn streaming off.
  bool stream = 2;
}

// StreamEvent is one SSE event of an upstream stream that matched the
// endpoint's usageStreamEvents allow-list.
message StreamEvent {
  // The event name as the host resolved it: the "event:" line when the
  // upstream sent one, otherwise the "type" field of the data object (the
  // same resolution the declarative usage.sse rules use, so a plugin and a
  // rule match the same events).
  string name = 1;
  // The event's data, exactly as it arrived: never joined with another
  // event, never rewritten.
  bytes data = 2;
}

// ExtractUsageRequest is the observation of one successful upstream answer,
// handed to the plugin by a HostService.RelayUpstream that waited
// (RelayUpstreamResponse.observation). It is never the whole stream:
//   - non-streaming: the whole body, of any size;
//   - streaming: every event whose name the endpoint listed in
//     usageStreamEvents, in arrival order, of any number and size; the
//     host never buffers the whole stream.
message ExtractUsageRequest {
  RequestMeta meta = 1;
  // The account that served the request, as in ExecuteRequest.account.
  Account account = 2;
  // Upstream HTTP status (always 2xx: a failed exchange comes back as
  // RelayUpstreamResponse.error instead).
  int32 status = 3;
  // Upstream response headers, lower-cased.
  map<string, string> headers = 4;
  // Non-streaming: the whole response body. Empty when the response
  // streamed.
  bytes body = 5;
  // Streaming: the events matching usageStreamEvents, in arrival order.
  // Empty for a non-streaming response.
  repeated StreamEvent events = 6;
  reserved 7;
  reserved "truncated";
  // Values of the REQUEST fields the endpoint listed in usageRequestFields,
  // JSON-encoded and keyed by path - the same map EstimateUsageRequest
  // carries, read from the body handed to Execute. It exists
  // for endpoints that only START work: their response says {"id": ...} and
  // nothing about the size of the job, while the request carries the
  // resolution and the duration an estimate has to be made from.
  //
  // Only declared paths travel, each value whole whatever its size.
  // Empty for endpoints that declare no usageRequestFields.
  map<string, string> fields = 8;
  reserved 9;
  reserved "fields_omitted";
}

// UsageReport is what the plugin states about the upstream response. Every
// field is an UPSTREAM FACT. Attribution (user, api key, group, account),
// pricing (multiplier, price id, expression, cost) and the request's own
// facts (status, attempts, latency, node, timestamps) are filled by the host
// and OVERWRITE anything a plugin might try to say about them - this message
// has no field for them on purpose.
message UsageReport {
  // Token counts; zero-valued when the upstream reports none.
  UsageTokens tokens = 1;
  // Extra metering facts, keyed exactly like the endpoint's usage.facts
  // declarations (price expressions read them as u("key")). A key the
  // manifest does not declare is dropped with a warning, and a value that
  // does not fit the declared type (number / boolean / enum) is dropped the
  // same way: what a price expression can read stays what the manifest says
  // exists.
  map<string, string> facts = 2;
  // The model the upstream actually served, when it differs from the one the
  // request was billed as (usage_logs.upstream_model).
  string upstream_model = 3;
  // The plugin's reading of an upstream error inside a 2xx response (an
  // error event in a stream, a body that reports a failure with status 200).
  // Empty leaves whatever the host itself concluded.
  string error_type = 4;
  string error_message = 5;
  // Free-form JSON object stored in usage_logs.plugin_detail and shown in
  // the console's usage detail, of any size (the column is jsonb). A
  // document that is not a JSON object becomes {} and warns.
  string detail_json = 6;
  // Set when this request only STARTED work upstream whose real usage is not
  // known yet - a video generation job, say. The host prices the estimate,
  // charges it through the ordinary ledger path, marks the usage row
  // "reserved" and reconciles it later through Monitor. Leave it
  // unset (the case for every endpoint that answers within its response) and
  // nothing about this request changes.
  Reservation reserve = 7;
}

// Facts about a newly accepted upstream task, never scheduling or ownership.
message TaskSubmission {
  // Must match the task ID in a declared endpoint.task.idPaths response field.
  string upstream_ref_id = 1;
  // Complete initial query response, as a JSON object, at most 256 KiB.
  // It carries the upstream ID; the host substitutes its public task ID.
  string snapshot_json = 2;
  // Optional usage or estimate. Free tasks do not need a reservation.
  // A reservation's ref_id must equal upstream_ref_id; the host replaces it
  // with the public ID before persisting the reservation.
  UsageReport usage = 3;
  int32 next_check_after_sec = 4;
  int32 deadline_sec = 5;
}

// Reservation is a plugin's statement that the work is not finished and its
// own estimate of it (PLUGIN-EXECUTES-CORE-RECORDS §3.4).
//
// The estimate is what keeps a user with a $0 balance from submitting a
// thousand video jobs: the pre-request balance check is a cached read that
// tolerates a brief overdraft, and a job that answers in an hour turns that
// "brief" into an hour per job, all of them in flight at once.
message Reservation {
  // The plugin's own id for the work (a task id). Unique per plugin: it is
  // half of the key of the host's pending_settlements table, so submitting
  // the same ref_id twice registers one entry, not two. At most 200 bytes.
  string ref_id = 1;
  // The ESTIMATE. Priced, charged and recorded exactly like a real usage
  // report, and it stays the charge if the reconcile never succeeds.
  UsageTokens tokens = 2;
  // Estimated metering facts, keyed like the endpoint's usage.facts, same
  // rules as UsageReport.facts.
  map<string, string> facts = 3;
  // How long to wait before the first reconcile. 0 (or less) leaves it to
  // the host's backoff. The host clamps it to its own backoff ceiling.
  int32 next_check_after_sec = 4;
  // UPSTREAM FACT: how long this entry can be asked about at all - an Ark
  // video task is queryable for 7 days, after which no answer exists to be
  // had. The host clamps it with the max_reconcile_age_sec setting; 0 takes
  // the host's default. When it passes, the host STOPS asking and the
  // estimate becomes the final charge (it does not refund: the call really
  // was made and the upstream really did the work).
  int32 deadline_sec = 5;
}

// ReconcileEntry is one pre-charged row the host is asking about.
message ReconcileEntry {
  // The ref_id the plugin gave in its Reservation.
  string ref_id = 1;
  // The gateway request this entry came from (usage_logs.request_id), so a
  // plugin can correlate it with what it stored in detail_json.
  string request_id = 2;
  // How many times this entry has already been checked; 0 on the first.
  int32 attempts = 3;
  // When the entry was registered, and the moment after which the host stops
  // asking (the clamped deadline). Unix seconds.
  int64 created_at_unix = 4;
  int64 deadline_at_unix = 5;
  // Set for host-managed async tasks. ref_id remains the upstream ID.
  string task_kind = 6;
  string model = 7;
  string protocol = 8;
}

// ReconcileResult is what the plugin read out of the upstream's answer to its
// Monitor query.
message ReconcileResult {
  enum State {
    // Still running. The host reschedules with next_check_after_sec (or its
    // own backoff). Valid progress resets consecutive query failures.
    // This is the ZERO VALUE for wire compatibility. A plugin that cannot
    // interpret the response must explicitly return POLL_FAILED instead.
    PENDING = 0;
    // Finished: tokens carries the REAL usage. The host reprices, charges
    // the difference (kind "usage") or refunds it (kind "refund"), and
    // closes the row as billed.
    SETTLED = 1;
    // The work failed upstream and produced nothing. The host refunds the
    // whole reservation and records the row as free with reason as its
    // error type.
    FAILED = 2;
    // Finished, but the upstream reported NO usage for it - a status document
    // that says "succeeded" and nothing else. The estimate the plugin gave in
    // its Reservation stands as the final usage and the final charge: the
    // host closes the row as billed without moving any money, and marks it
    // so an operator can tell it from a row whose usage was confirmed.
    //
    // This is what to answer instead of SETTLED with zero tokens, which would
    // reprice the row at zero and REFUND the whole reservation - the work was
    // done, so that is a free job, and nothing in the record would say so.
    // tokens and facts are ignored in this state: a plugin that has some of
    // the real figures answers SETTLED with the ones it has.
    SETTLED_ESTIMATE = 3;
    // The upstream explicitly says this task does not exist (including gone).
    // The host closes observation and refunds any outstanding reservation.
    // No task snapshot is required; this is not an HTTP/RPC NotFound error.
    NOT_FOUND = 4;
    // This query failed: network/auth/rate limit/server/parser errors, or an
    // unrecognized status. The host counts consecutive failures and retries.
    // A valid PENDING resets that counter. Never disguise query errors as PENDING.
    POLL_FAILED = 5;
  }
  State state = 1;
  // PENDING/POLL_FAILED: when to ask again. 0 leaves it to the host's backoff; the
  // host clamps it to the backoff ceiling either way.
  int32 next_check_after_sec = 2;
  // SETTLED only: the real usage, replacing the estimate. Ignored in every
  // other state, including SETTLED_ESTIMATE.
  UsageTokens tokens = 3;
  // SETTLED only: the real metering facts, replacing the estimated ones.
  map<string, string> facts = 4;
  // FAILED/NOT_FOUND/POLL_FAILED: why. Terminal failures are recorded as
  // usage_logs.error_type (truncated to 50
  // bytes) and error_message. SETTLED_ESTIMATE may use it too, as a short
  // note on why no usage was available (recorded with the marker, not as an
  // error: the row stays a success).
  string reason = 5;
  // Complete query response for a successfully observed async task (JSON
  // object, at most 256 KiB). Empty preserves the prior snapshot. Transport
  // errors must never erase an existing result. The host substitutes its
  // public ID and fences every write by the current task claim token.
  string task_snapshot_json = 6;
}

message BuildQuotaRequestRequest {
  // The account whose quota is asked for, credentials included (the account
  // type is always this plugin's). platform is empty: no client endpoint is
  // involved.
  Account account = 1;
}

message BuildQuotaRequestResponse {
  string method = 1;               // default "GET"
  // Absolute http(s) URL. The host rejects private/loopback/link-local
  // targets (SSRF guard) unless the account goes through a proxy, and sends
  // it through the account's proxy.
  string url = 2;
  map<string, string> headers = 3;
  string body_json = 4;            // optional
  reserved 5;
  reserved "runtime_operation";
}

message ParseQuotaResponseRequest {
  Account account = 1;             // as in BuildQuotaRequest
  // Upstream status, 0 for a transport error (see transport_error).
  int32 status = 2;
  map<string, string> headers = 3; // lower-cased
  bytes body = 4;                  // the whole answer body
  string transport_error = 5;
  reserved 6;
  reserved "truncated";
}

// QuotaWindow is one usage window of a subscription, e.g. the 5-hour or the
// weekly limit.
message QuotaWindow {
  // Window key. The host and console know "5h", "7d", "7d_sonnet" and
  // "7d_fable"; other upstreams may use their own keys
  // (^[a-z0-9][a-z0-9_]{0,31}$). Windows are merged by key with what the
  // host already knows (a window missing from one answer keeps its last
  // value).
  string key = 1;
  // Share of the window used, in PERCENT (0-100; over 100 when the upstream
  // allows overage). When 0 and limit > 0 the host derives it from
  // used / limit.
  double utilization = 2;
  // When the window resets, Unix seconds; 0 = unknown.
  int64 resets_at_unix = 3;
  // "allowed", "allowed_warning", "rejected" or empty (unknown). Anything
  // else is stored as empty.
  string status = 4;
  // Optional absolute figures, for upstreams that report them.
  int64 used = 5;
  int64 limit = 6;
  bool utilization_unknown = 7;
}

// QuotaResult is what the plugin read out of the quota answer.
message QuotaResult {
  enum ErrorType {
    // Success: windows carries the quota (it may be empty).
    ERROR_TYPE_UNSPECIFIED = 0;
    // The upstream rejected the credentials (401/403, revoked token). The
    // host records the error on the snapshot; it does NOT disable or cool
    // down the account - the gateway's own classification does that.
    ERROR_TYPE_AUTH_REJECTED = 1;
    // Any other failure: transport error, 429, 5xx, unreadable body. The
    // host records it and does not ask again for a minute.
    ERROR_TYPE_TRANSIENT = 2;
  }
  repeated QuotaWindow windows = 1;
  ErrorType error_type = 2;
  // Why, shown with the snapshot. At most 512 bytes are kept.
  string error_message = 3;
  int64 next_check_at_unix = 4;
}

message CheckModelAvailabilityRequest {
  repeated ModelAvailabilityCandidate candidates = 1;
  int64 now_unix = 2;
}

message ModelAvailabilityCandidate {
  int64 account_id = 1;
  string account_type = 2;
  string model = 3;
  AccountQuotaSnapshot quota = 4;
  string client_model = 5;
}

message AccountQuotaSnapshot {
  repeated QuotaWindow windows = 1;
  int64 updated_at_unix = 2;
  string error = 3;
  int64 revision = 4;
  int64 generation = 5;
}

message CheckModelAvailabilityResponse {
  repeated ModelAvailability results = 1;
}

message ModelAvailability {
  int64 account_id = 1;
  string model = 2;
  enum State {
    UNKNOWN = 0;
    AVAILABLE = 1;
    UNAVAILABLE = 2;
  }
  State state = 3;
  string reason = 4;
  int64 retry_at_unix = 5;
}

message BuildRefreshRequestRequest {
  // The account to renew, credentials included (the account type is always
  // this plugin's). platform is empty: no client endpoint is involved.
  Account account = 1;
  // Why the core renews the credentials now (CONTRACTS §141.3). Diagnostic
  // only: the request is built the same way for every reason. UNSPECIFIED
  // comes from a core that does not say.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_SCHEDULED = 1;    // the sweep: the expiry is within beforeExpirySec
    REASON_FORCED = 2;       // an administrator's refresh-credentials
    REASON_SAVED = 3;        // right after a save stored credentials already due
    REASON_UNAUTHORIZED = 4; // the upstream answered 401 to a gateway request
  }
  Reason reason = 2;
}

message BuildRefreshRequestResponse {
  string method = 1;               // default "POST"
  // Absolute http(s) URL. The host rejects private/loopback/link-local
  // targets (SSRF guard) unless the account goes through a proxy, and sends
  // it through the account's proxy.
  string url = 2;
  map<string, string> headers = 3;
  // Optional request body, sent as is. Despite the name it need not be JSON:
  // when headers set a Content-Type (e.g. application/x-www-form-urlencoded)
  // the host keeps it; when they set none and the body is not empty the host
  // adds Content-Type: application/json.
  string body_json = 4;
}

message ParseRefreshResponseRequest {
  Account account = 1;             // as in BuildRefreshRequest
  // Upstream status, 0 for a transport error (see transport_error).
  int32 status = 2;
  map<string, string> headers = 3; // lower-cased
  bytes body = 4;                  // the whole answer body
  string transport_error = 5;
  reserved 6;
  reserved "truncated";
}

// RefreshResult is what the plugin read out of the refresh answer.
message RefreshResult {
  enum ErrorType {
    // Success: credentials_patch_json carries the renewed fields.
    ERROR_TYPE_UNSPECIFIED = 0;
    // The upstream refused the refresh credential for good (invalid_grant,
    // revoked, 401/403): retrying cannot help. The host records it, stops
    // refreshing this account until its credentials change, and does not
    // touch the account's status - the gateway's classification of the
    // next upstream error does that (§42).
    ERROR_TYPE_AUTH_REJECTED = 1;
    // Any other failure: transport error, 429, 5xx, unreadable body. The
    // host records it and tries again on its next pass.
    ERROR_TYPE_TRANSIENT = 2;
  }
  // JSON object of the credential fields to set, merged into the stored
  // credentials at the top level: listed keys are replaced, a null value
  // removes the key, unlisted keys are kept. Typically access_token,
  // refresh_token (when rotated) and expires_at. Required on success.
  string credentials_patch_json = 1;
  ErrorType error_type = 2;
  // Why, recorded with the account's refresh state. At most 512 bytes are
  // kept.
  string error_message = 3;
}

message BuildBalanceRequestRequest {
  // The account whose balance is asked for, credentials included (the account
  // type is always this plugin's). platform is empty: no client endpoint is
  // involved.
  Account account = 1;
}

message BuildBalanceRequestResponse {
  reserved 1 to 4;
  reserved "method", "url", "headers", "body_json";
  // The requests one balance query takes, sent in this order; at least one.
  // An answer without requests is a plugin error.
  repeated BalanceRequest requests = 5;
}

// BalanceRequest is one upstream request of a balance query.
message BalanceRequest {
  string method = 1;               // default "GET"
  // Absolute http(s) URL. Its host must pass the manifest's upstream host
  // rules (externalServices, or an address in the account's upstreamFields)
  // and the administrator's plugin network policy; if any request of the
  // query fails them, none is sent. The host rejects private/loopback/
  // link-local targets (SSRF guard) unless the account goes through a proxy,
  // sends it through the account's proxy and does not follow redirects (a
  // 3xx is handed to ParseBalanceResponse as is).
  string url = 2;
  // Sent as is. Leave the credential out of a request that does not need it
  // (a public endpoint): the host adds none of its own.
  map<string, string> headers = 3;
  // Optional request body, sent as is; when headers set no Content-Type and
  // the body is not empty the host adds Content-Type: application/json.
  string body_json = 4;
}

message ParseBalanceResponseRequest {
  Account account = 1;             // as in BuildBalanceRequest
  reserved 2 to 6;
  reserved "status", "headers", "body", "transport_error", "truncated";
  // One answer per request of BuildBalanceRequestResponse, in the same
  // order. The host sends every request even when an earlier one failed, so
  // the plugin always sees all of them.
  repeated BalanceAnswer answers = 7;
}

// BalanceAnswer is the upstream's answer to one BalanceRequest.
message BalanceAnswer {
  // Upstream status, 0 for a transport error (see transport_error).
  int32 status = 1;
  map<string, string> headers = 2; // lower-cased
  bytes body = 3;                  // the whole answer body
  string transport_error = 4;
}

message ParseBalanceResponseResponse {
  BalanceResult result = 1;
}

// BalanceResult is what the plugin read out of the balance answers.
message BalanceResult {
  enum ErrorType {
    // Success: amount_micros and currency carry the balance, or unlimited
    // is set.
    ERROR_TYPE_UNSPECIFIED = 0;
    // The upstream rejected the credentials (401/403, revoked or expired
    // key). The host records the error on the snapshot; it does NOT disable
    // or cool down the account - the gateway's own classification does that.
    ERROR_TYPE_AUTH_REJECTED = 1;
    // Any other failure: transport error, 429, 5xx, unreadable body, a
    // value the plugin cannot read. The host records it, keeps the last
    // successful amount (shown as stale) and asks again at the next update
    // interval.
    ERROR_TYPE_TRANSIENT = 2;
  }
  // The number the upstream reports, in millionths (7.25 = 7250000), as it
  // is: never converted to another unit or currency. Ignored when
  // unlimited is set.
  int64 amount_micros = 1;
  // The unit the upstream gives with the number, as it gives it (e.g.
  // "USD"; any text, not checked), empty when it gives none. Stored and
  // shown as it is. Ignored when unlimited is set.
  string currency = 2;
  ErrorType error_type = 3;
  // Why, shown with the snapshot. At most 512 bytes are kept.
  string error_message = 4;
  // The upstream reports no limit for this account (an unlimited key): the
  // console shows "unlimited" instead of an amount. amount_micros and
  // currency are ignored. Only meaningful on success.
  bool unlimited = 5;
}
