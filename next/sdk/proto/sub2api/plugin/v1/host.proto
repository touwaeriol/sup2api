syntax = "proto3";

package sub2api.plugin.v1;

option go_package = "github.com/Sub2API-Devs/sup2api/next/sdk/gen/pluginv1;pluginv1";

import "sub2api/plugin/v1/common.proto";
import "sub2api/plugin/v1/platform.proto";
import "sub2api/plugin/v1/observation.proto";

// HostService is served by the host to one plugin instance over the
// go-plugin broker. The host knows which plugin is calling from the broker
// connection and checks the matching grant on every call. RelayUpstream and
// ExecuteHTTP instead require the invocation-local authority (execution
// token) the host issued for one PlatformService.Execute or Monitor call, or
// (ExecuteHTTP only) for one console call of HTTPService.HandleHTTP.
// Calls without the required authority fail with PERMISSION_DENIED.
service HostService {
  rpc SetAccountAutomaticState(SetAccountAutomaticStateRequest) returns (SetAccountAutomaticStateResponse);
  rpc ReadObservationMetrics(ReadObservationMetricsRequest) returns (ReadObservationMetricsResponse);
  // sticky.clear (grant "sticky.clear"): delete a share of the sticky session
  // bindings that point at an account and could serve (group_id, model), so
  // those sessions pick an account again on their next request (CONTRACTS
  // §74.2).
  rpc ClearStickyBindings(ClearStickyBindingsRequest) returns (ClearStickyBindingsResponse);
  // environment (always granted): the resolved environment variables of a
  // group and optionally an account, for work outside a gateway request
  // (CONTRACTS §74.3). Requests carry theirs in RequestMeta.environment.
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  // settings (always granted): the effective values of sections of the
  // system settings, for work outside a gateway request (CONTRACTS §107).
  // values_json holds the fields CONTRACTS lists for the section, never a
  // secret; version changes exactly when the values do. No sections asks
  // for all of them; an unknown section is INVALID_ARGUMENT. Changes are
  // announced to every plugin process by PluginService.SettingsChanged.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // users.read (grant "users.read"): basic facts of console users by id, to
  // check that a user exists or to show who they are (CONTRACTS §75.3). At
  // most 500 ids per call; unknown and deleted users are left out.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  // notify.send (grant "notify.send"): the notification channels of the
  // enabled plugins, and sending through one by its id; the core queues,
  // deduplicates, rate limits and retries (CONTRACTS §74.4).
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse);
  rpc Notify(NotifyRequest) returns (NotifyResponse);
  // Pure local tokenization. No upstream traffic and no billing side effects.
  rpc CountTokens(CountTokensRequest) returns (CountTokensResponse);
  // The host's HTTP client for one PlatformService.Execute call (relay) and
  // for Execute and Monitor calls (ExecuteHTTP, the fetch form). A plugin
  // opens no socket: it describes the request and the host sends it under
  // the account of the call - its proxy, transport, SSRF guard, timeouts
  // and the operator's header settings. Authority is the call's
  // execution token, bound to the calling process, the selected account and
  // immutable attribution, and void once the call returns. No monetary
  // amount, user identity or account selector is accepted, and the host
  // never retries: retry and failover are its own decision per attempt.
  //
  // RelayUpstream hands over the FINAL upstream request of the execution;
  // the upstream's answer goes to the client, never to the plugin. At most
  // one per execution, in one of two forms:
  //   - wait = false: the host validates the request (URL and its host,
  //     SSRF name check, headers) and answers at once with an empty
  //     response. Nothing is sent until Execute returns
  //     host_usage; the host then sends, relays and reads the usage by the
  //     declared rules. An Execute that fails or returns anything else
  //     after this leaves the request unsent.
  //   - wait = true: the host sends and relays now and answers when the
  //     exchange has ended, with the observation of a successful answer
  //     (the whole body, or the listed events of a stream) or the facts of
  //     a failed one. Only for executions whose
  //     ExecuteRequest sets extract_usage or task_submission; otherwise
  //     FAILED_PRECONDITION.
  // A request the host refuses is INVALID_ARGUMENT and counts as not relayed.
  rpc RelayUpstream(RelayUpstreamRequest) returns (RelayUpstreamResponse);
  // log (always granted)
  rpc Log(LogRequest) returns (LogResponse);

  // kv (grant "kv"): Redis-backed, namespaced per plugin.
  rpc KVGet(KVGetRequest) returns (KVGetResponse);
  rpc KVSet(KVSetRequest) returns (KVSetResponse);
  rpc KVDelete(KVDeleteRequest) returns (KVDeleteResponse);
  rpc KVList(KVListRequest) returns (KVListResponse);
  // kv batch (grant "kv", CONTRACTS §93): many keys of ONE namespace in one
  // call. The host checks the grant once and makes one Redis round trip
  // (MGET, one host-owned script, DEL), so the cost does not grow with the
  // number of keys the way N single calls do.
  //
  //   - Namespace, key, value and ttl rules are those of the single calls.
  //     At most 512 keys or items per call, and at most 3 MiB of keys plus
  //     values in one KVSetMany; otherwise INVALID_ARGUMENT. A key may
  //     repeat: KVGetMany answers every occurrence, KVSetMany keeps the
  //     last one. No keys is valid and does nothing.
  //   - KVGetMany answers one item per requested key, in request order.
  //     When the values found add up to more than 3 MiB the call fails with
  //     RESOURCE_EXHAUSTED and the caller asks for fewer keys (48 keys
  //     always fit).
  //   - KVSetMany is all or nothing: when any item is invalid nothing is
  //     written, otherwise every item is written with its own ttl in one
  //     atomic step. ttl_seconds is 0 (no expiry) up to 9223372036.
  //   - The script is the host's own. Plugins cannot submit scripts.
  rpc KVGetMany(KVGetManyRequest) returns (KVGetManyResponse);
  rpc KVSetMany(KVSetManyRequest) returns (KVSetManyResponse);
  rpc KVDeleteMany(KVDeleteManyRequest) returns (KVDeleteManyResponse);

  // secrets (grant "secrets"): seal / open small values (<= 64 KiB) with the
  // core master key (AES-256-GCM). The ciphertext is bound to the calling
  // plugin and to `context`, so another plugin, or another row of the same
  // plugin, cannot open it. The plugin stores the ciphertext itself, e.g. an
  // upstream API key in its own schema (CONTRACTS §72.2).
  rpc SecretSeal(SecretSealRequest) returns (SecretSealResponse);
  rpc SecretOpen(SecretOpenRequest) returns (SecretOpenResponse);

  // prices (grant "prices"): price token usage of a model with the core
  // model price table, exactly as gateway settlement would before the group
  // multiplier. Read only: nothing is charged or recorded (CONTRACTS §72.13.1).
  rpc PriceUsage(PriceUsageRequest) returns (PriceUsageResponse);

  // db.schema: the DSN of the plugin schema (CONTRACTS §115). Behind the
  // egress tunnel it is the virtual address db.sub2api:5432 without
  // credentials, which the core logs in to as its own database user with
  // search_path on the schema; without the tunnel (development) it is the
  // core's DSN with search_path pinned. The SDK dialer goes through
  // EgressService automatically.
  rpc GetDSN(GetDSNRequest) returns (GetDSNResponse);

  // authz: does a console user hold a permission? Own keys always; others
  // need authz.read.
  rpc AuthzCheck(AuthzCheckRequest) returns (AuthzCheckResponse);

  // Always granted: which accounts may the caller of a request act on? The
  // answer is the core's own account scope rule (CONTRACTS §21.0), so a
  // plugin route applies it instead of deciding by itself. user_id must be
  // the Caller of an HTTPService.HandleHTTP request this plugin is serving
  // when it asks; any other user is PERMISSION_DENIED, as is a user holding
  // account:<action> at no scope (not even own).
  rpc AccountScopeCheck(AccountScopeCheckRequest) returns (AccountScopeCheckResponse);

  // ledger.credit / ledger.debit: bounded by the approved scope
  // (maxPerTx, maxPerDay), idempotent on idempotency_key.
  rpc LedgerCredit(LedgerChangeRequest) returns (LedgerChangeResponse);
  rpc LedgerDebit(LedgerChangeRequest) returns (LedgerChangeResponse);

  // broadcast (grant "broadcast"): deliver a small message to this plugin's
  // instances on every other live node (AppService.OnBroadcast), best
  // effort, e.g. "rules changed, reload". Payload at most 64 KiB.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // jobs (grant "jobs"): runtime tasks, the plugin's own
  // scheduled tasks besides manifest jobs[] (CONTRACTS §77.8). Each is the
  // cluster task plugin.<key>.<id>; a run calls AppService.RunJob with its
  // id, scope "cluster" and the task's args. Only the instance of the
  // plugin's active version changes them: the calls of an older or newer
  // version during a rollout succeed and change nothing.
  //
  // SyncTasks replaces all runtime tasks of the plugin with the given ones
  // (declarative; repeating it is harmless).
  rpc SyncTasks(SyncTasksRequest) returns (SyncTasksResponse);
  // UpsertTask adds or changes one runtime task.
  rpc UpsertTask(UpsertTaskRequest) returns (UpsertTaskResponse);
  // DeleteTask removes one runtime task; runs already queued do not run.
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  // ListTasks returns the runtime tasks of the plugin.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // EnqueueTask submits one run of a runtime task or a cluster manifest job,
  // with its own args.
  rpc EnqueueTask(EnqueueTaskRequest) returns (EnqueueTaskResponse);

  // lock (grant "lock"): short cross-node mutual exclusion on the host's
  // Redis, for work that must not run on two nodes at once. Periodic work
  // belongs in manifest jobs[] instead (each trigger runs once cluster-wide).
  //
  //   - The host prefixes every name: the Redis key is
  //     lock:plugin:{plugin_key}:{name}, so plugins never see each other's
  //     locks. name must match ^[A-Za-z0-9._:/-]{1,128}$ and ttl_ms must be
  //     1000..300000, otherwise INVALID_ARGUMENT.
  //   - Validity is reported as a DURATION (valid_ms), counted by the host on
  //     its own clock from when it took or extended the lock, minus a drift
  //     margin - never as an absolute time, so plugin and host clocks do not
  //     have to agree. The plugin should count it from BEFORE it sent the
  //     request.
  //   - The locks are NOT fenced: a holder that stalls past its validity may
  //     find another node has taken the lock meanwhile, so the guarded work
  //     must still be idempotent.
  //   - The PLUGIN chooses the owner token: a fresh random value for every
  //     LockAcquire (at least 16 random bytes, e.g. from a CSPRNG, encoded
  //     as URL-safe base64 or hex), matching ^[A-Za-z0-9_-]{16,128}$. The
  //     host stores it as the lock's value in Redis. Because the plugin
  //     knows the token before it asks, a LockAcquire whose outcome is
  //     unknown (UNAVAILABLE, a deadline, a broken connection) can be undone
  //     with LockRelease(name, token) instead of blocking every other node
  //     until the ttl runs out.
  //   - Never reuse a token: a LockAcquire with the token of a lock this
  //     plugin ALREADY holds under that name fails the SET NX, and the
  //     cleanup of the failed attempt (a compare-and-delete with the same
  //     token) then deletes the held lock. The call answers acquired=false
  //     and nobody holds the lock afterwards.
  //   - The host keeps no state per lock: when the plugin process dies its
  //     locks lapse after their ttl.
  //   - Errors: no "lock" grant -> PERMISSION_DENIED; bad name, ttl or token
  //     -> INVALID_ARGUMENT; Redis unavailable or outcome unknown ->
  //     UNAVAILABLE (the lock may or may not be held - treat it as not held;
  //     after a LockAcquire, call LockRelease with the same token).
  //
  // LockAcquire makes ONE attempt, without waiting. acquired=false means
  // another holder has it; that is not an error.
  rpc LockAcquire(LockAcquireRequest) returns (LockAcquireResponse);
  // LockRenew extends a lock still held with token to ttl_ms from now.
  // held=false means the lock is definitely lost (expired, or held by
  // someone else); it is not an error.
  rpc LockRenew(LockRenewRequest) returns (LockRenewResponse);
  // LockRelease releases the lock only if it is still held with token.
  // Idempotent: releasing a lock that expired, was already released or was
  // never taken is not an error. UNAVAILABLE means the host could not tell
  // whether it was released; it then lapses after its ttl (or retry).
  rpc LockRelease(LockReleaseRequest) returns (LockReleaseResponse);

  // ---------------------------------------------------------------- accounts
  //
  // The calls below let a plugin reach the accounts of ITS OWN account types
  // outside a gateway request - a plugin's own HTTP routes get only
  // Caller{user_id, request_id, client_ip, locale}, so without them a console
  // page that has to talk to the upstream with the account's own credentials
  // (the Volcengine Ark asset library signs its OpenAPI calls with the
  // account's AK/SK) cannot be built at all. No grant: a plugin receives the
  // accounts of the account types it declares (CONTRACTS §124).
  //
  // Only accounts whose account type this plugin declares are visible.
  // Anything else is reported as NOT_FOUND, never PERMISSION_DENIED: a
  // different code would tell the plugin that an account id it may not read
  // exists.

  // Metadata of the accounts of this plugin's account types; a plugin that
  // declares none gets an empty list. It is the list a plugin needs to offer
  // "pick an account" in its own console page. Paginated: at most 200 rows
  // per call (100 by default).
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // The account of this plugin's own account types, as PlatformService calls
  // receive it: properties, settings, decrypted credentials and the proxy
  // (CONTRACTS §124). Another plugin's account, a deleted one or none at all
  // is NOT_FOUND. Audited on every call: the audit_logs row is written before
  // the account is returned, and a failed write fails the call. The proxy is
  // data: the plugin never connects through it itself.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  // The fetch form of the host's HTTP client: one non-streaming
  // HTTP exchange whose answer goes back to the plugin. For the auxiliary
  // requests of an Execute call (token exchange, upload, preflight) and the
  // upstream query of a Monitor call. Authority comes from the call's
  // execution token, not from a generic net/accounts permission.
  //
  // The URL must be http(s). Its host must be one of the manifest's
  // externalServices (or a subdomain of one), or the host of one of the
  // call's own account's upstream addresses: the values of the address
  // fields its account type declares (manifest upstreamFields), so that an
  // account an operator pointed at a relay can be queried there. No other
  // host is reachable. In both cases the host sends the request through the
  // account's proxy behind the SSRF guard - an account address naming a
  // private target is refused like any other unless the account's scope
  // allows it -, without the operator's header passthrough and override
  // (those describe the client's request, which this is not), and does not
  // follow redirects. The host neither counts the requests of a call nor
  // cuts their answers: the answer body comes back whole; nor does it bound
  // the request body (the request body limit applies to the client's
  // request in the gateway only). A transport
  // failure is not an RPC error: it comes back in transport_error with
  // status 0.
  //
  // A console route call (HTTPRequest.execution_token) may fetch too, for
  // the authorization of an account not saved yet: it has no account, so
  // only externalServices are reachable, and every fetch names the proxy
  // ticket the console issued (ExecutionHTTPRequest.proxy_ticket, CONTRACTS
  // §117).
  rpc ExecuteHTTP(ExecutionHTTPRequest) returns (ExecutionHTTPResponse);

  // One HTTP request for ONE account of this plugin's account types, sent
  // by the host through that account's proxy (behind netguard for a direct
  // connection), the same way as the quota and refresh requests the plugin
  // describes (CONTRACTS §91). The URL must be http(s) and its host one of
  // the manifest's externalServices (or a subdomain of one) or the host of
  // one of the account's own upstream addresses (manifest upstreamFields;
  // CONTRACTS §112.17). Redirects are not followed; the answer body comes back whole.
  // A transport failure is not an RPC error: it comes back in
  // transport_error with status 0.
  // Audited on every call (account, method, host and path; never headers or
  // bodies).
  rpc SendAccountRequest(SendAccountRequestRequest) returns (ExecutionHTTPResponse);
}

message SendAccountRequestRequest {
  int64 account_id = 1;
  string method = 2;                   // empty = GET
  string url = 3;
  map<string, string> headers = 4;
  // Sent as is; Content-Type defaults to application/json when a body is
  // given and the headers set none.
  bytes body = 5;
}

message SetAccountAutomaticStateRequest {
  int64 account_id = 1;
  AccountAutomaticState state = 2;
}

message SetAccountAutomaticStateResponse {
  bool changed = 1;
  string status = 2;
  string reason = 3;
  int64 until_unix = 4;
}

message ClearStickyBindingsRequest {
  int64 account_id = 1;
  // Bindings whose key does not include the group dimension match any group.
  int64 group_id = 2;
  // Client model (before account mapping); bindings whose key does not
  // include the model dimension match any model.
  string model = 3;
  // 1..100: share of the matching bindings to delete.
  int32 percent = 4;
  // Picks which bindings fall into the share; a different salt picks others.
  string salt = 5;
}

message ClearStickyBindingsResponse {
  int64 matched = 1;
  int64 cleared = 2;
}

message GetEnvironmentRequest {
  int64 group_id = 1;
  int64 account_id = 2; // 0 = the group alone
}

message GetEnvironmentResponse {
  map<string, int64> environment = 1;
}

message GetSettingsRequest {
  repeated string sections = 1; // e.g. "sticky"; none = every section
}

message GetSettingsResponse {
  repeated SettingsSection sections = 1; // in request order, once each
}

message SettingsSection {
  string name = 1;
  string version = 2;     // the first 16 hex digits of the SHA-256 of values_json
  string values_json = 3; // a JSON object, the fields of CONTRACTS §107
}

message GetUsersRequest {
  repeated int64 user_ids = 1;
}

message GetUsersResponse {
  repeated UserInfo users = 1; // in user_ids order, without the missing ones
}

// UserInfo carries no email or roles: a plugin must not pass user data on to
// callers with weaker permissions than users.read (CONTRACTS §75.3).
message UserInfo {
  int64 id = 1;
  string display_name = 2;
  string status = 3; // active | disabled
}

message CountTokensRequest {
  string text = 1;
  string encoding = 2; // o200k_base (default) | cl100k_base
}
message CountTokensResponse {
  int64 tokens = 1;
  string encoding = 2;
}

// UpstreamRequest is the final upstream request of one execution, as the
// plugin built it. The host sends these bytes: it does not patch the body.
message UpstreamRequest {
  string method = 1;               // default "POST"
  // Absolute URL: http(s), or for a websocket turn the URL of the
  // handshake. The host rejects private/loopback/link-local targets
  // (SSRF guard) unless the account goes through a proxy or its scope
  // allows them. The host parses the URL again before sending: write the
  // path the way it goes on the wire, every segment already percent-encoded.
  string url = 2;
  // Authoritative headers: written AFTER the operator's passthrough and
  // override, so those cannot change them. Only for what must reach the
  // upstream exactly as built: the credential header and the headers a
  // signature covers (with a signature, the Content-Type it was computed
  // with). Everything else belongs in default_headers, except in a plugin
  // whose released versions sent every header above the operator's
  // settings and keeps doing so.
  map<string, string> headers = 3;
  // Default headers: written BEFORE the operator's settings. A passed
  // through client header only fills a name these leave unset; the
  // account's header override and parameter override may replace or
  // remove them.
  //
  // In both maps names are lower-case, and content-length, accept-encoding,
  // connection and transfer-encoding are the transport's: a request naming
  // one is refused. A name in both maps takes the authoritative value.
  map<string, string> default_headers = 4;
  // The final body bytes; for a websocket turn the message of this turn.
  // The host does not bound it (the request body limit applies to the
  // client's request in the gateway only).
  bytes body = 5;
  // Upstream model after the plugin's own mapping, recorded in usage logs
  // (optional).
  string upstream_model = 6;
  // Optional: format of the response body when it is not SSE or JSON; the
  // name covers the framing and the shape of the events in it.
  // "aws-eventstream-chunk" (sdk/awseventstream.FormatChunk): when the
  // upstream answers 2xx with the content type
  // application/vnd.amazon.eventstream, the host decodes the frames into
  // server-sent events and treats the answer as an ordinary
  // text/event-stream from then on. It reads "chunk" events only, the ones
  // of Bedrock's InvokeModelWithResponseStream: the payload
  // {"bytes": base64} becomes one SSE event carrying the decoded bytes, and
  // an exception or error frame becomes a final "error" event in the shape
  // of an Anthropic stream error. Event streams of another shape (Bedrock's
  // ConverseStream) are not covered by this name. An answer with another
  // content type is left as it is. An unknown name, or any name on a
  // websocket turn, is refused.
  string response_stream = 7;
  // Timeouts are the host's (the account's and the administrator's
  // settings); proxy, TLS, redirects and retries are not the plugin's to
  // choose either.
  reserved 8;
  reserved "options";
}

message RelayUpstreamRequest {
  string execution_token = 1;
  UpstreamRequest request = 2;
  // false: validate, keep the request for after Execute, answer at once.
  // true: send and relay now, answer with the observation.
  bool wait = 3;
}

// RelayUpstreamResponse is empty unless the relay waited; then exactly one
// field is set.
message RelayUpstreamResponse {
  // A 2xx answer: the usage observation - the whole body of a non-streaming
  // answer, the events the endpoint lists of a stream, never the stream
  // itself. The plugin reads it into ExecuteResponse.usage or .task.
  ExtractUsageRequest observation = 1;
  // A failed exchange (a non-2xx status or a transport error). The plugin
  // classifies it locally and returns ExecuteResponse.classification; the
  // host retains the corresponding bytes and decides retry/failover
  // eligibility.
  ClassifyErrorRequest error = 2;
}

message ExecutionHTTPRequest {
  string execution_token = 1;
  string method = 2;                   // empty = GET
  string url = 3;
  map<string, string> headers = 4;
  // Sent as is; Content-Type defaults to application/json when a body is
  // given and the headers set none.
  bytes body = 5;
  reserved 6;
  reserved "options";
  // Only in a console route call, and required there: the proxy ticket the
  // console issued for the account being authorized (POST
  // /account-types/:plugin_key/:type/proxy-ticket, CONTRACTS §117). The host
  // sends the fetch through the proxy it names - or directly when it names
  // none - once it has checked that the ticket is this plugin's, was issued
  // to the user of the call and that the user may still use that proxy. The
  // plugin never learns the proxy. Refused in Execute and Monitor calls,
  // whose fetches go through the account's own proxy.
  string proxy_ticket = 7;
}

message ExecutionHTTPResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
  // An ExecuteHTTP answer the host could not read whole comes back with
  // transport_error set; such an answer never confirms a terminal state.
  string transport_error = 4;
  reserved 5;
  reserved "truncated";
}

message ListAccountsRequest {
  // Restrict to one account type id declared by this plugin; "" = all of them.
  // An unknown type simply matches nothing (it names no account the plugin
  // could see anyway).
  string type = 1;
  // Keyset cursor: "" starts at the lowest account id, otherwise pass the
  // next_cursor of the previous response. Rows are ordered by id.
  string cursor = 2;
  // Page size, 1..200; 0 or out of range uses 100.
  int32 limit = 3;
  // Include accounts whose status is not "active" (disabled, error) and
  // accounts taken out of scheduling. Default: only active, schedulable ones.
  bool include_inactive = 4;
}

message ListAccountsResponse {
  repeated AccountSummary accounts = 1;
  // Cursor of the next page; "" when this was the last one.
  string next_cursor = 2;
}

// AccountSummary is the metadata of one account in a ListAccounts page; the
// whole account (credentials, proxy) is GetAccount's.
message AccountSummary {
  int64 id = 1;
  string name = 2;
  // Account type id, always one this plugin declares.
  string type = 3;
  string status = 4;         // active | disabled | error
  // Whether the account takes gateway traffic (accounts.schedulable).
  bool enabled = 5;
  // Non-sensitive settings, the account type's settingsFields (base_url ...).
  // These are stored in plain JSONB and are the same values the plugin is
  // given as Account.settings_json on the gateway path.
  string settings_json = 6;
}

message GetAccountRequest {
  int64 account_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message PublishRequest {
  string topic = 1;                    // ^[a-z0-9_.-]{1,64}$
  bytes payload = 2;
}

message PublishResponse {}

// PluginTask is one runtime task of a plugin.
message PluginTask {
  string id = 1;                       // ^[a-z0-9][a-z0-9_.-]{0,63}$, not a manifest job id
  // "@every <duration>" (at least 10s) or a 5-field cron (UTC); empty for a
  // task that only runs what EnqueueTask submits.
  string schedule = 2;
  bytes args = 3;                      // JSON passed to every periodic run, at most 64 KiB
  int32 timeout_sec = 4;               // 0: 60; at most 3600
  // Read only: the console's switch (permission task:manage). A stopped task
  // is not run; SyncTasks and UpsertTask keep the switch as it is.
  bool enabled = 5;
}

message SyncTasksRequest {
  repeated PluginTask tasks = 1;       // at most 200
}

message SyncTasksResponse {
  bool ignored = 1;                    // not the active version: nothing changed
}

message UpsertTaskRequest {
  PluginTask task = 1;
}

message UpsertTaskResponse {
  bool ignored = 1;
}

message DeleteTaskRequest {
  string id = 1;
}

message DeleteTaskResponse {
  bool ignored = 1;
  bool deleted = 2;
}

message ListTasksRequest {}

message ListTasksResponse {
  repeated PluginTask tasks = 1;
}

message EnqueueTaskRequest {
  string id = 1;                       // a runtime task or a cluster manifest job
  bytes args = 2;                      // JSON, at most 64 KiB
  int64 run_at_unix = 3;               // 0: now
  // Keeps one unfinished run per task and key: a second EnqueueTask with
  // the same key while one waits or runs submits nothing.
  string unique_key = 4;
}

message EnqueueTaskResponse {}

message LockAcquireRequest {
  string name = 1;                     // ^[A-Za-z0-9._:/-]{1,128}$
  int64 ttl_ms = 2;                    // 1000..300000
  // Required. The owner token, chosen by the plugin: fresh random for every
  // call, ^[A-Za-z0-9_-]{16,128}$. Pass the same value to LockRenew and
  // LockRelease. See the notes on HostService.LockAcquire.
  string token = 3;
}

message LockAcquireResponse {
  // false = held by someone else (not an error); valid_ms unset.
  bool acquired = 1;
  // The token is the one sent in the request (the host used to generate it).
  reserved 2;
  reserved "token";
  // How long the lock stays valid, counted by the host from when it took
  // it, minus a drift margin.
  int64 valid_ms = 3;
}

message LockRenewRequest {
  string name = 1;
  string token = 2;                    // ^[A-Za-z0-9_-]{16,128}$
  int64 ttl_ms = 3;                    // 1000..300000
}

message LockRenewResponse {
  // false = definitely lost (expired, or held by someone else).
  bool held = 1;
  // Remaining validity after the renewal, as in LockAcquireResponse.
  int64 valid_ms = 2;
}

message LockReleaseRequest {
  string name = 1;
  string token = 2;                    // ^[A-Za-z0-9_-]{16,128}$
}

message LockReleaseResponse {}

message LogRequest {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_DEBUG = 1;
    LEVEL_INFO = 2;
    LEVEL_WARN = 3;
    LEVEL_ERROR = 4;
  }
  Level level = 1;
  string message = 2;
  map<string, string> attrs = 3;
}

message LogResponse {}

message SecretSealRequest {
  bytes plaintext = 1;
  // Free-form binding chosen by the plugin, e.g. "channel:3" (<= 128 bytes).
  string context = 2;
}

message SecretSealResponse {
  bytes ciphertext = 1;
}

message SecretOpenRequest {
  bytes ciphertext = 1;
  string context = 2;
}

message SecretOpenResponse {
  bytes plaintext = 1;
}

message PriceUsageRequest {
  // Complete model id of the price row.
  string model = 1;
  // "inclusive": input counts the cached tokens too (OpenAI);
  // "exclusive": input excludes them (Anthropic). Empty = exclusive.
  string semantics = 2;
  int64 input = 3;
  int64 output = 4;
  int64 cache_read = 5;
  int64 cache_creation = 6;
  int64 cache_creation_1h = 7;
}

message PriceUsageResponse {
  bool priced = 1;
  // Decimal string (8 places); empty when not priced.
  string cost = 2;
  // When not priced: "no_price" | "video_only" | "eval_error".
  string reason = 3;
}

message KVGetRequest {
  string namespace = 1;
  string key = 2;
}

message KVGetResponse {
  bool found = 1;
  bytes value = 2;
}

message KVSetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;           // <= 64 KiB
  int64 ttl_seconds = 4;     // 0 = no expiry
}

message KVSetResponse {}

message KVDeleteRequest {
  string namespace = 1;
  string key = 2;
}

message KVDeleteResponse {}

message KVListRequest {
  string namespace = 1;
  string prefix = 2;
  string cursor = 3;
  int32 limit = 4;           // <= 500
}

message KVListResponse {
  repeated string keys = 1;
  string next_cursor = 2;
}

message GetDSNRequest {}

message GetDSNResponse {
  // postgres:// DSN of the plugin schema (see GetDSN).
  string dsn = 1;
  string schema = 2;
  reserved 3;
  reserved "role_isolated";
}

message AuthzCheckRequest {
  int64 user_id = 1;
  // Plugin-local key ("rules:manage") or fully qualified key. The plugin's
  // own keys need no grant, with or without a scope ("flow:manage:own",
  // "flow:manage:flow/3"); a core key or another plugin's key needs
  // "authz.read".
  string permission = 2;
}

message AuthzCheckResponse {
  bool allowed = 1;
}

message AccountScopeCheckRequest {
  // HTTPRequest.caller.user_id of a request in flight.
  int64 user_id = 1;
  // "read", "update" or "test".
  string action = 2;
  // The accounts asked about; at most 500. May be empty to learn only
  // whether the user reaches every account.
  repeated int64 account_ids = 3;
}

message AccountScopeCheckResponse {
  // The user holds account:<action> for every account: every account is in
  // scope and allowed_ids is empty.
  bool all = 1;
  // Otherwise (a narrower scope: own, groups, ids): the ids among
  // account_ids that are live accounts in the user's scope, in request
  // order, once each.
  repeated int64 allowed_ids = 2;
}

message LedgerChangeRequest {
  int64 user_id = 1;
  string amount = 2;         // positive decimal string, USD, <= 8 decimals
  string idempotency_key = 3;
  string ref_type = 4;
  string ref_id = 5;
  string note = 6;
}

message LedgerChangeResponse {
  int64 ledger_id = 1;
  string balance_after = 2;
  bool duplicate = 3;        // idempotency key already applied
}

// EgressService is the only way a plugin reaches the network in strict mode.
// One bidirectional stream per connection:
//   plugin -> host : open, then data..., then close
//   host -> plugin : result, then data..., then close
service EgressService {
  rpc Dial(stream EgressFrame) returns (stream EgressFrame);
}

message EgressFrame {
  oneof kind {
    DialOpen open = 1;
    DialResult result = 2;
    bytes data = 3;          // <= 32 KiB per frame
    DialClose close = 4;
  }
}

message DialOpen {
  string network = 1;        // "tcp" (udp is not supported)
  string address = 2;        // "host:port"; host is resolved by the host
}

message DialResult {
  bool ok = 1;
  string error = 2;
  string remote_addr = 3;
}

message DialClose {
  string error = 1;          // empty = clean close
}

message ListNotificationChannelsRequest {}

message NotificationChannel {
  string id = 1;
  // The plugin delivering it.
  string plugin_key = 2;
  map<string, string> label = 3;
  map<string, string> description = 4;
  // email | text
  string recipient = 5;
}

message ListNotificationChannelsResponse {
  repeated NotificationChannel channels = 1;
}

message NotifyRequest {
  string channel = 1;
  // 1..20 recipients in the channel's format.
  repeated string recipients = 2;
  string subject = 3;
  // Plain text.
  string body = 4;
  // info (default) | warning | critical
  string severity = 5;
  // Optional: a second notification with the same key from the same plugin
  // within dedupe_seconds is dropped (the first one's id is answered).
  string dedupe_key = 6;
  // 0 = 600 seconds; at most 86400.
  int32 dedupe_seconds = 7;
}

message NotifyResponse {
  int64 id = 1;
  bool deduplicated = 2;
}

// KV batch calls (CONTRACTS §93). They stand after the other messages so
// that the generated code of the existing ones does not move.
message KVGetManyRequest {
  string namespace = 1;
  repeated string keys = 2;      // <= 512
}

message KVGetManyItem {
  bool found = 1;
  bytes value = 2;
}

message KVGetManyResponse {
  // One per requested key, in request order.
  repeated KVGetManyItem items = 1;
}

message KVSetManyItem {
  string key = 1;
  bytes value = 2;               // <= 64 KiB
  int64 ttl_seconds = 3;         // 0 = no expiry
}

message KVSetManyRequest {
  string namespace = 1;
  repeated KVSetManyItem items = 2;   // <= 512; keys + values <= 3 MiB
}

message KVSetManyResponse {}

message KVDeleteManyRequest {
  string namespace = 1;
  repeated string keys = 2;      // <= 512
}

message KVDeleteManyResponse {}
