name: plugin release

# Publishes first-party plugin packages as GitHub releases, for the plugin
# store's registry (touwaeriol/sup2api-plugin, CONTRACTS §135), one release
# per package:
#
#   plugin-<key>-v<version>  ->  release with <key>-<version>.s2plugin
#
# Started by pushing such a tag on a develop commit, or by hand on develop
# (workflow_dispatch) for the given keys, or every plugin, at their manifest
# versions; then the release creates the tag and versions already released
# are skipped (.github/plugin-release/resolve-tags.sh). The tag must name the
# plugin's manifest key and version (.github/plugin-release/package-plugin.sh).
# The package is not signed (store installs trust the index's sha256,
# CONTRACTS §136). After the release, register it in the registry:
#   sub2api-plugin registry add-version --registry . --plugin <key> --tag <tag>
# and open a PR to its develop branch. A published release is never changed:
# a rerun after a partial publish fails on the existing release; delete it
# (or bump the version) first.
#
# Only publish can write; untrusted values reach `run:` only through env.

on:
  push:
    tags:
      - 'plugin-*-v*'
  workflow_dispatch:
    inputs:
      plugins:
        description: Plugin keys separated by spaces (empty = every plugin whose manifest version has no release)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    env:
      EVENT: ${{ github.event_name }}
      REF: ${{ github.ref }}
      REF_NAME: ${{ github.ref_name }}
      PLUGINS: ${{ inputs.plugins }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: tags
        run: |
          if [ "$EVENT" = push ]; then
            tags=$(jq -cn --arg t "$REF_NAME" '[$t]')
          else
            [ "$REF" = refs/heads/develop ] || { echo "::error::run it on develop"; exit 1; }
            # shellcheck disable=SC2086 # PLUGINS is a list of keys
            tags=$(sh .github/plugin-release/resolve-tags.sh $PLUGINS)
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "releasing: $tags"

  build:
    name: build ${{ matrix.tag }}
    needs: resolve
    if: needs.resolve.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.tags) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sub2api
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TAG: ${{ matrix.tag }}
      TEST_DATABASE_URL: postgres://postgres:sub2api@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on develop
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || {
            echo "::error::$TAG does not point at a commit on develop"; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: next/go.work
          check-latest: false
          cache: false
      - name: Verify the Go version matches next/go.work
        run: sh .github/next-ci/next-go-version.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # next/Dockerfile NODE_IMAGE
          node-version: '24'
      - name: Install next/web (the plugin UIs build with its vite)
        working-directory: next/web
        run: npm ci --no-audit --no-fund
      - name: Package
        run: sh .github/plugin-release/package-plugin.sh "$TAG" out
      - name: Package digest
        run: |
          {
            echo "### $TAG"
            echo '```'
            (cd out && sha256sum ./*.s2plugin)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.tag }}
          path: out/*.s2plugin
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ matrix.tag }}
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.tags) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ matrix.tag }}
      EVENT: ${{ github.event_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.tag }}
          path: out
      - name: Create the release
        run: |
          pkg=$(ls out/*.s2plugin)
          name=$(basename "$pkg" .s2plugin)
          rest=${TAG#plugin-}
          notes="插件包 $name（未签名；从插件商店安装时按索引里的 sha256 校验）。登记：sub2api-plugin registry add-version --registry . --plugin ${rest%-v*} --tag $TAG"
          # Never "Latest" (that is the core's); a version with a pre-release
          # part is a prerelease.
          set -- --latest=false
          # A pushed tag must exist; by hand the release creates it here.
          if [ "$EVENT" = push ]; then set -- "$@" --verify-tag; else set -- "$@" --target "$GITHUB_SHA"; fi
          case "${rest##*-v}" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$TAG" "$pkg" --title "插件 $name" --notes "$notes" "$@"
