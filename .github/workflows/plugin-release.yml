name: plugin release

# Publishes one first-party plugin package as a GitHub release, for the plugin
# store's registry (touwaeriol/sup2api-plugin, CONTRACTS §135):
#
#   plugin-<key>-v<version>  ->  release with <key>-<version>.s2plugin
#
# The tag must point at a commit on develop and name the plugin's manifest key
# and version (.github/plugin-release/package-plugin.sh). The package is not
# signed (store installs trust the index's sha256, CONTRACTS §136). After the
# release, register it in the registry:
#   sub2api-plugin registry add-version --registry . --plugin <key> --tag <tag>
# and open a PR to its develop branch. A published release is never changed:
# a rerun after a partial publish fails on the existing release; delete it
# (or bump the version) first.
#
# build has no write access; only publish can create the release. Untrusted
# values reach `run:` only through env.

on:
  push:
    tags:
      - 'plugin-*-v*'

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build package
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sub2api
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TAG: ${{ github.ref_name }}
      TEST_DATABASE_URL: postgres://postgres:sub2api@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on develop
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || {
            echo "::error::$TAG does not point at a commit on develop"; exit 1; }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: next/go.work
          check-latest: false
          cache: false
      - name: Verify the Go version matches next/go.work
        run: sh .github/next-ci/next-go-version.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # next/Dockerfile NODE_IMAGE
          node-version: '24'
      - name: Install next/web (the plugin UIs build with its vite)
        working-directory: next/web
        run: npm ci --no-audit --no-fund
      - name: Package
        run: sh .github/plugin-release/package-plugin.sh "$TAG" out
      - name: Package digest
        run: |
          {
            echo "### $TAG"
            echo '```'
            (cd out && sha256sum ./*.s2plugin)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/*.s2plugin
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out
      - name: Create the release
        run: |
          pkg=$(ls out/*.s2plugin)
          name=$(basename "$pkg" .s2plugin)
          rest=${TAG#plugin-}
          notes="插件包 $name（未签名；从插件商店安装时按索引里的 sha256 校验）。登记：sub2api-plugin registry add-version --registry . --plugin ${rest%-v*} --tag $TAG"
          # Never "Latest" (that is the core's); a version with a pre-release
          # part is a prerelease.
          set -- --latest=false
          case "${rest##*-v}" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$TAG" "$pkg" --verify-tag --title "插件 $name" --notes "$notes" "$@"
